<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromium Foldable Skia Compositor Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1b4b, #0f172a 80%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    button {
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button.active {
      background: #3b82f6;
      border-color: #60a5fa;
    }

    /* Buggy configuration */
    .overlay.buggy {
      width: min(480px, 90vw);
      padding: 24px;
      background-color: rgba(20, 24, 38, 0.7);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
      transform: translate3d(0, 0, 0);
      contain: layout paint;
      isolation: isolate;
    }

    /* Fixed configuration */
    .overlay.fixed {
      width: min(480px, 90vw);
      padding: 24px;
      background-color: rgba(16, 20, 32, 0.96);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
      transform: none;
      contain: none;
      isolation: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .grid-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 6px;
      border-radius: 6px;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>Chromium Skia Foldable Test</h1>
  <div class="controls">
    <button id="btnBuggy" class="active" onclick="setMode('buggy')">Buggy Mode (backdrop-filter + 3D)</button>
    <button id="btnFixed" onclick="setMode('fixed')">Fixed Mode (Solid 2D)</button>
  </div>

  <div id="demoOverlay" class="overlay buggy">
    <h2>Sample Overlay / Menu</h2>
    <p>On Android foldables, Buggy Mode causes Skia tile splitting and ghost duplicate items.</p>
    <div class="grid">
      <div class="grid-item">Item 1</div>
      <div class="grid-item">Item 2</div>
      <div class="grid-item">Item 3</div>
      <div class="grid-item">Item 4</div>
      <div class="grid-item">Item 5</div>
      <div class="grid-item">Item 6</div>
      <div class="grid-item">Item 7</div>
      <div class="grid-item">Item 8</div>
    </div>
  </div>

  <script>
    function setMode(mode) {
      const overlay = document.getElementById('demoOverlay');
      const btnBuggy = document.getElementById('btnBuggy');
      const btnFixed = document.getElementById('btnFixed');

      if (mode === 'buggy') {
        overlay.className = 'overlay buggy';
        btnBuggy.classList.add('active');
        btnFixed.classList.remove('active');
      } else {
        overlay.className = 'overlay fixed';
        btnFixed.classList.add('active');
        btnBuggy.classList.remove('active');
      }
    }
  </script>
</body>
</html>
